# Training Hyperparameters
dataset_path: "../data_pineapple/FULL_UNIFIED"
path_test_ids: "./test_ids.txt"
batch_size: 8
num_workers: 4
lr: 0.0001
epochs: 150
rec_importance: 1
seed: 42

# Model Paths & Checkpoints
chkps_logging_path: "checkpoints/diffusion/betaKL@0.001/" #### This is for Vanilla VAE
vae_chkp: "submodules/VAE/checkpoints/VAE/betaKL@0.001/best.pt"

# Early Stopping
patience: -1
es_min_delta: 0.1

# Flags (Store True)
do_wandb: True
non_uniform_sampling: false
attention: false
augment: false
constant_lr: false

# Logging & Tracking
run_name: "Vanilla-VAE-DIFF-NOAT-long_v2"
wandb_run_id: null