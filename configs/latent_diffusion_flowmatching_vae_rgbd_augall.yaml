# Training Hyperparameters
dataset_path: "/data/oortega/pineapple_960x544.h5"
path_test_ids: "./test_ids.txt"  # unused when dataset_path is a .h5 file (splits are precomputed inside it)
batch_size: 8
num_workers: 4
lr: 0.0001
epochs: 500   # best checkpoint of the 800-epoch runs was at ~485 (DDPM); the rest was wasted GPU time
rec_importance: 1
seed: 42

# Model Paths & Checkpoints
chkps_logging_path: "/work/oortega/checkpoints/diffusion/flowmatching_vae_rgbd_augall/" #### Retrained on the GAN + uniform-augmentation VAE (vae_rgbd_gan_aug_all), RGB+D -> RGB+D
vae_chkp: "/work/oortega/checkpoints/vae_rgbd_gan_aug_all/betaKL@0.001/best.pt"

# Early Stopping
patience: -1
es_min_delta: 0.1

# Flags (Store True)
do_wandb: True
non_uniform_sampling: false   # unused by Flow Matching (continuous t, no discrete timesteps)
attention: false
augment: false
constant_lr: false

# Generator: "ddpm" (default, used by all other configs) or "flowmatching"
generator: "flowmatching"

# Logging & Tracking
run_name: "AugAll-RGBD-FlowMatching-v1"
wandb_run_id: null
